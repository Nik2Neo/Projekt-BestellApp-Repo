<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>

    <!-- styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/basket.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/content.css">

    <!-- scripts -->
    <script src="/scripts/db.js"></script>

</head>
<body>
    <header>
        
        <nav class="header-inner">
            <img src="assets/icons/Logo.png" alt="Logo">
            <a>
                <img src="assets/icons/menu.png" alt="Menu">
            </a>
        </nav>        
    </header>


    <main>
        <section class="content">
            <div class="hero">
                <img class="hero-img" src="assets/img/hero.png" alt="hero-image">
                <img class="logo-burger-img" src="assets/icons/logo-burger.png" alt="Logo-Burger">
            </div>

            <div class="content-headline">
                <h1>
                    <span class="text-orange">Burger</span>House
                </h1>

                <p class="content-headline-rating">
                    ★ <strong>4,1</strong> <span class="content-headline-rating-number">(317)</span>  
                </p>
            </div>

            <h3 class="content-headline-description">
                The best of Burgers, Pizza, and Greens, all in one place.
            </h3>


            <div class="content-food-menu">
                <div class="content-food-menu-headline">
                    <img class="food-img" src="assets/img/burger.png" alt="food-img">
                    <h2>
                        Burger & Sandwiches
                    </h2>
                </div>

                <div class="content-food-menu-dish">
                    <img src="assets/img/Veggie-mushroom-black-burger.png" alt="dish-1">

                    <div class="content-food-menu-dish-content">
                        <div class="content-food-menu-dish-content-text">
                            <h4>
                                Veggie mushroom black burger
                            </h4>

                            <p>
                                Mixed green salad, Tomatoes, Edamame, Mushrooms
                            </p>
                        </div>
                        <div class="content-food-menu-dish-content-price">
                            <h4>
                                16,90€
                            </h4>

                            <button>
                                Add to basket
                            </button>
                        </div>
                    </div>
                </div>
                    
            </div>

        </section>


        <section class="basket_wrapper">

        </section>
    </main>


    <footer>
        
    </footer>
</body>

    <!-- scripts -->
    <script src="script.js"></script>
    <script src="scripts/templates.js"></script>
</html>
